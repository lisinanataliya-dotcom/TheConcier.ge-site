<!doctype html>
<html lang="en">
<head>

  <link rel="icon" href="assets/logo.png" type="image/png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="TheConcier.ge — Boutique Travel Services">
  <meta property="og:description" content="Bespoke journeys, flights, exceptional hotels, private aviation and personal concierge service worldwide.">
  <meta property="og:image" content="https://theconcier.ge/assets/hero.jpg">
  <meta property="og:url" content="https://theconcier.ge/">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="hero">
    <div class="photo" aria-hidden="true"></div>
    <div class="wash" aria-hidden="true"></div>

    <section class="page">
      <header class="topbar">

        <div class="lang-switch" aria-label="Language">
          <button type="button" data-lang="en">EN</button>
          <span>/</span>
          <button type="button" data-lang="ru">RU</button>
        </div>
      </header>

      <section class="copy">
        <h1 data-i18n="headline">Travel, thoughtfully arranged.</h1>
        <p class="intro" data-i18n="intro">Bespoke journeys, flights, exceptional hotels, private aviation and personal concierge service — arranged quietly, precisely and around you.</p>
      </section>

      <section class="services" aria-label="Services">
        <div class="service">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M3 18.5 28 7l-5.5 6 4.5 4-2.4 1.1-5.4-2.5-5.6 6.2v5.2l-2.3 1-1.5-7-5.6 1.9Z"/>
          </svg>
          <span data-i18n="flights">Flights</span>
        </div>
        <div class="service">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M5 9v14M27 9v14M5 17h22M8 12h8a3 3 0 0 1 3 3v2H8Zm11 0h5a3 3 0 0 1 3 3v2h-8Z"/>
          </svg>
          <span data-i18n="hotels">Hotels</span>
        </div>
        <div class="service">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M5 20h22M7 20a9 9 0 0 1 18 0M16 11V8M14 8h4"/>
          </svg>
          <span data-i18n="experiences">Experiences</span>
        </div>
        <div class="service">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M3 18 28 11l-6 5 6 4-2.2 1-7.2-2-5 5v4l-2 1-1.4-6.6-6.2 1.7Z"/>
          </svg>
          <span data-i18n="privateJets">Private jets</span>
        </div>
        <div class="service">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M5 20h22M7 20a9 9 0 0 1 18 0M16 11V8M14 8h4M10 24h12"/>
          </svg>
          <span data-i18n="concierge">Concierge</span>
        </div>
      </section>

      <footer class="contacts">
        <a href="mailto:info@theconcier.ge" aria-label="Email info@theconcier.ge">
          <svg viewBox="0 0 28 28" aria-hidden="true">
            <rect x="3" y="6" width="22" height="16" rx="1.5"></rect>
            <path d="m4 8 10 8 10-8"></path>
          </svg>
          <span>info@theconcier.ge</span>
        </a>
        <i aria-hidden="true"></i>
        <a href="tel:+79219432333" aria-label="Call +7 921 943 23 33">
          <svg viewBox="0 0 28 28" aria-hidden="true">
            <path d="M8 4 5.5 6.5c-.8.8.1 4.8 4.8 9.5s8.7 5.6 9.5 4.8l2.5-2.5-4.3-3.1-2.1 2.1c-2.1-1.1-4.9-3.9-6-6l2.1-2.1Z"></path>
          </svg>
          <span>+7 921 943 23 33</span>
        </a>
      </footer>
    </section>
  </main>

  <script>
    const translations = {
      en: {
        headline: "Travel, thoughtfully arranged.",
        intro: "Bespoke journeys, flights, exceptional hotels, private aviation and personal concierge service — arranged quietly, precisely and around you.",
        flights: "Flights",
        hotels: "Hotels",
        experiences: "Experiences",
        privateJets: "Private jets",
        concierge: "Concierge",
        title: "TheConcier.ge — Boutique Travel Services",
        description: "TheConcier.ge — boutique travel services. Bespoke journeys, flights, exceptional hotels, private aviation and personal concierge service worldwide."
      },
      ru: {
        headline: "Путешествия в деталях.",
        intro: "Индивидуальные путешествия, авиабилеты, лучшие отели, частная авиация и персональный консьерж-сервис — спокойно, точно и с вниманием к вашим привычкам.",
        flights: "Авиабилеты",
        hotels: "Отели",
        experiences: "Впечатления",
        privateJets: "Частные джеты",
        concierge: "Консьерж",
        title: "TheConcier.ge — Boutique Travel Services",
        description: "TheConcier.ge — индивидуальные путешествия, авиабилеты, лучшие отели, частная авиация и персональный консьерж-сервис."
      }
    };

    function browserPreference() {
      const langs = navigator.languages && navigator.languages.length
        ? navigator.languages
        : [navigator.language || "en"];
      return langs.some(l => String(l).toLowerCase().startsWith("ru")) ? "ru" : "en";
    }

    function applyLanguage(lang, remember = true) {
      const t = translations[lang] || translations.en;
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach(el => {
        el.textContent = t[el.dataset.i18n];
      });
      document.title = t.title;
      document.querySelector('meta[name="description"]').setAttribute("content", t.description);

      document.querySelectorAll("[data-lang]").forEach(btn => {
        const active = btn.dataset.lang === lang;
        btn.classList.toggle("active", active);
        btn.setAttribute("aria-pressed", active ? "true" : "false");
      });

      if (remember) localStorage.setItem("theconcierLang", lang);
    }

    const saved = localStorage.getItem("theconcierLang");
    applyLanguage(saved || browserPreference(), false);

    document.querySelectorAll("[data-lang]").forEach(btn => {
      btn.addEventListener("click", () => applyLanguage(btn.dataset.lang, true));
    });
  </script>
</body>
</html>
